# /etc/nginx/sites-available/logguard
# example.com 을 내 도메인으로 바꾸세요. HTTPS 인증서는 certbot 이 자동으로 추가합니다.
limit_req_zone $binary_remote_addr zone=logguard_upload:10m rate=6r/m;

server {
    listen 80;
    server_name example.com;

    client_max_body_size 55m;          # 앱 제한(50MB)보다 살짝 크게
    client_body_timeout 120s;

    location = /analyze     { limit_req zone=logguard_upload burst=3 nodelay; proxy_pass http://127.0.0.1:8000; include /etc/nginx/proxy_params; proxy_read_timeout 300s; }
    location = /api/analyze { limit_req zone=logguard_upload burst=3 nodelay; proxy_pass http://127.0.0.1:8000; include /etc/nginx/proxy_params; proxy_read_timeout 300s; }

    location / {
        proxy_pass http://127.0.0.1:8000;
        include /etc/nginx/proxy_params;
    }
}
