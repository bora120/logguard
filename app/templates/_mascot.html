{# 로그가드 마스코트 '가디': 방패 모양 캐릭터. mood = calm / worried / alert #}
{% macro gardi(mood="calm", size=120, cls="") -%}
<svg class="gardi {{ cls }}" width="{{ size }}" height="{{ size }}" viewBox="0 0 120 120" role="img"
     aria-label="{{ {'calm': '웃고 있는 로그가드 마스코트', 'worried': '고민하는 로그가드 마스코트', 'alert': '깜짝 놀란 로그가드 마스코트'}[mood] }}">
  <path d="M60 8 C76 16 92 19 104 20 C104 62 92 92 60 112 C28 92 16 62 16 20 C28 19 44 16 60 8 Z"
        fill="#F9BDD2" stroke="#EE8FB4" stroke-width="3" stroke-linejoin="round"/>
  <path d="M60 18 C73 24 86 27 95 28 C94 50 88 68 76 82" fill="none" stroke="#FFFFFF" stroke-width="4"
        stroke-linecap="round" opacity=".55"/>
  <ellipse cx="38" cy="66" rx="8" ry="5" fill="#F58FB0" opacity=".55"/>
  <ellipse cx="82" cy="66" rx="8" ry="5" fill="#F58FB0" opacity=".55"/>
  {% if mood == "calm" %}
  <path d="M40 54 q5 -6 10 0" fill="none" stroke="#3B2B33" stroke-width="3.5" stroke-linecap="round"/>
  <path d="M70 54 q5 -6 10 0" fill="none" stroke="#3B2B33" stroke-width="3.5" stroke-linecap="round"/>
  <path d="M52 68 q8 8 16 0" fill="none" stroke="#3B2B33" stroke-width="3.5" stroke-linecap="round"/>
  {% elif mood == "worried" %}
  <circle cx="45" cy="55" r="4.5" fill="#3B2B33"/>
  <circle cx="75" cy="55" r="4.5" fill="#3B2B33"/>
  <path d="M38 44 l12 3" stroke="#3B2B33" stroke-width="3" stroke-linecap="round"/>
  <path d="M82 44 l-12 3" stroke="#3B2B33" stroke-width="3" stroke-linecap="round"/>
  <path d="M51 73 q4.5 -4 9 0 q4.5 4 9 0" fill="none" stroke="#3B2B33" stroke-width="3.2" stroke-linecap="round"/>
  {% else %}
  <circle cx="45" cy="54" r="5.5" fill="#3B2B33"/>
  <circle cx="75" cy="54" r="5.5" fill="#3B2B33"/>
  <circle cx="46.5" cy="52.5" r="1.6" fill="#FFFFFF"/>
  <circle cx="76.5" cy="52.5" r="1.6" fill="#FFFFFF"/>
  <ellipse cx="60" cy="72" rx="5" ry="6" fill="#3B2B33"/>
  <path d="M96 34 q5 8 0 12 q-5 -4 0 -12 Z" fill="#9FD3F0"/>
  {% endif %}
</svg>
{%- endmacro %}
